name: Deploy frontend to Hostinger

# Builds the static export and mirrors it into public_html over SSH — the same
# result as deleting everything except backend/ and uploading out/ by hand.
on:
  push:
    branches: [main]
    # Only frontend changes redeploy; wordpress/ plugin edits do not. The
    # workflow file is deliberately absent so editing it never deploys by itself.
    paths:
      - "eqo-logiq-frontend (1)/**"
  # Price and stock load live in the browser, but a product page only exists if
  # the product existed at build time. Rebuild nightly (03:00 IST) so products
  # added in WordPress get their page without anyone remembering to deploy.
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would change on the server without touching it"
        type: boolean
        default: false

# Deployments queue rather than cancel: aborting mid-rsync would leave
# public_html half-updated.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Pinned rather than ubuntu-latest, which moves from 24.04 to 26.04 gradually
    # between 2026-10-19 and 2026-11-19, so runs would land on either.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # Relative to the SSH user's home directory.
      DEPLOY_PATH: domains/eqologiq.in/public_html
    defaults:
      run:
        working-directory: "eqo-logiq-frontend (1)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "eqo-logiq-frontend (1)/package-lock.json"

      - name: Install dependencies
        run: npm ci

      # Reads NEXT_PUBLIC_* from the committed .env and pulls live products from
      # the WordPress backend to generate a page per product. Do not cache
      # .next/cache: build fetches use `revalidate: false`, so a restored fetch
      # cache would bake in old product data and nightly builds would never
      # pick up new products.
      - name: Build static site
        run: npm run build

      # A build can exit 0 having produced very little (e.g. the backend was
      # down). Publishing that would wipe the live site, so check it looks real.
      - name: Verify build output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — refusing to deploy"; exit 1; }
          test -f out/.htaccess  || { echo "::error::out/.htaccess missing — refusing to deploy"; exit 1; }
          test -d out/product    || { echo "::error::out/product missing — refusing to deploy"; exit 1; }
          pages=$(find out -name index.html | wc -l)
          products=$(find out/product -mindepth 2 -name index.html | wc -l)
          echo "Generated $pages pages ($products product pages), $(du -sh out | cut -f1) total"
          [ "$pages" -ge 15 ]   || { echo "::error::only $pages pages — expected at least 15"; exit 1; }
          [ "$products" -ge 5 ] || { echo "::error::only $products product pages — expected at least 5"; exit 1; }

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the connection fails rather than trusting an
          # unknown server.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host hostinger
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # rsync --delete into the wrong directory would destroy it, and the
      # /backend/ exclusion only protects WordPress if it sits directly inside
      # the target. Require exactly that before writing anything.
      - name: Confirm target directory
        run: |
          ssh hostinger "test -f '$DEPLOY_PATH/backend/wp-config.php'" \
            || { echo "::error::$DEPLOY_PATH/backend/wp-config.php not found on server — refusing to deploy"; exit 1; }

      # --delete removes files the new build no longer has (the manual "delete
      # everything" step). Excluded paths are never touched, deletes included:
      # /backend/ is the WordPress install, /.well-known/ is used for SSL renewal.
      # --delay-updates swaps all changed files in at the end instead of leaving
      # the site half-old/half-new during the upload. --checksum skips files whose
      # content is unchanged, so a typical deploy sends a few MB, not the full site.
      #
      # Two passes with identical options. The first is a dry run: rsync reports
      # exactly what it would change and changes nothing. The real pass only
      # happens if that report leaves backend/ and .well-known/ alone and
      # deletes a plausible number of files.
      - name: Deploy with rsync
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          deploy() {
            rsync -rlpz --checksum --chmod=D755,F644 \
              --delete --delete-delay --delay-updates \
              --exclude='/backend/' --exclude='/.well-known/' \
              --itemize-changes "$@" \
              out/ "hostinger:$DEPLOY_PATH/"
          }

          plan="$RUNNER_TEMP/rsync-plan.txt"
          deploy --dry-run > "$plan"
          deletions=$(grep -c '^\*deleting' "$plan" || true)
          echo "Planned: $(wc -l < "$plan") changes, $deletions deletions"
          grep '^\*deleting' "$plan" || true

          if grep -E '^\S+\s+(backend|\.well-known)(/|$)' "$plan"; then
            echo "::error::the lines above would change backend/ or .well-known/ — refusing to deploy"
            exit 1
          fi
          if [ "$deletions" -gt 300 ]; then
            echo "::error::$deletions deletions planned (limit 300) — refusing to deploy"
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing was changed on the server."
            exit 0
          fi

          deploy --stats

      - name: Smoke test
        if: ${{ !inputs.dry_run }}
        run: |
          ssh hostinger "test -f '$DEPLOY_PATH/backend/wp-config.php'" \
            || { echo "::error::backend/wp-config.php missing after deploy"; exit 1; }
          curl -fsS -o /dev/null https://eqologiq.in/ \
            || { echo "::error::eqologiq.in is not responding after deploy"; exit 1; }
          curl -fsS -o /dev/null https://backend.eqologiq.in/wp-json/ \
            || { echo "::error::backend.eqologiq.in/wp-json is not responding after deploy"; exit 1; }
          echo "eqologiq.in and backend.eqologiq.in both respond"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
